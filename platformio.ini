[platformio]
default_envs = tiny, xlarge
extra_configs = platformio.local.ini

[crosspoint]
version = 1.3.0
crossink_version = 1.4.0

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingInclude --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_upload.offset_address = 0x10000

; Shrink the mbedTLS outgoing record buffer from 16KB to 2KB (we only send
; small GET/POST requests). Saves ~14KB heap per TLS connection; OTA against
; GitHub was running out of heap during the handshake/header parse (#312).
; The incoming buffer must stay at 16KB: TLS peers may send full-size records.
; Triggers a pioarduino hybrid rebuild of the Arduino core libs.
; Field logs (#312) show the TLS handshake heap peak dropping free heap to
; ~1KB, which starves lwIP of RX pbufs and stalls the handshake into a
; connection timeout. KEEP_PEER_CERTIFICATE=n frees each cert of the server
; chain right after verification instead of keeping a parsed copy, shaving
; the peak where it matters. (MBEDTLS_DYNAMIC_BUFFER would help more but its
; --wrap link flags and port/dynamic objects are dropped by the pioarduino
; hybrid-build assembly, so it fails to link.)
custom_sdkconfig =
  CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
  CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
  CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048
  CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE=n
; Trim WiFi driver buffer pools (defaults 8/32/32). Field logs (#312) show
; TLS handshakes failing at ~42KB free because the driver's buffer bursts
; fragment the heap below one contiguous 16.6KB TLS RX buffer. An e-reader
; never needs 32 in-flight frames; stability beats throughput here.
  CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=6
  CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=8
  CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=16
; The C3 has no ECC hardware; software ECDHE/ECDSA runs for hundreds of ms
; per handshake while received TLS records pile up in RAM. Fixed-point comb
; tables (flash cost) cut that window several-fold, and the smaller dynamic
; RX pool caps the pile — together they keep enough heap for the software
; RSA-4096 verify that GitHub's and Let's Encrypt's chains now require.
  CONFIG_MBEDTLS_ECP_FIXED_POINT_OPTIM=y
; Allows esp-tls connections configured WITHOUT a CA option to proceed
; unverified. Only the OTA firmware-download CDN hop uses this, and only
; when the (fully verified) manifest supplied a sha256 that the downloaded
; image must match — see OtaUpdater.cpp. All other TLS in the firmware
; passes crt_bundle_attach and stays chain-verified.
  CONFIG_ESP_TLS_INSECURE=y
  CONFIG_ESP_TLS_SKIP_SERVER_CERT_VERIFY=y
; AMPDU RX reorder buffers compete with TLS for the same heap during
; handshakes and hurt on weak links; an e-reader gains nothing from frame
; aggregation.
  CONFIG_ESP_WIFI_AMPDU_RX_ENABLED=n
; None of these IDF components are used by CrossInk, and the ones with
; embedded certs (esp_insights, esp_rainmaker) break the hybrid rebuild
; (their generated cert .S files never materialize). Dropping them also
; shortens the framework rebuild considerably.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_diag_data_store
  espressif/esp_diagnostics
  espressif/esp_rainmaker
  espressif/rmaker_common
  espressif/cbor
  espressif/esp-zigbee-lib
  espressif/esp-zboss-lib
  espressif/esp-modbus
  espressif/esp_modem
  espressif/esp-serial-flasher
  espressif/network_provisioning
  chmorgan/esp-libhelix-mp3

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/build_web.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  pre:scripts/patch_websockets.py
  post:scripts/check_firmware_size.py
  post:scripts/rename_firmware.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3

lib_ignore =
  HalClockSim

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSINK_VERSION is set by scripts/git_branch.py (includes current branch)
  -DCROSSPOINT_FIRMWARE_VARIANT=\"tiny\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to debug for development builds
  -DOMIT_TEENSY_FONT
  -DOMIT_ITTY_BITTY_FONT
  -DOMIT_XLARGE_FONT
  -DOMIT_HUGE_FONT

[env:debug]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSINK_VERSION injected by scripts/git_branch.py
  ; (uses $CROSSPOINT_RC_HASH env var in CI, or git short hash locally)
  -DCROSSPOINT_FIRMWARE_VARIANT=\"tiny\"
  -DCROSSINK_BUILD_ENV=\"debug\"
  -DCROSSINK_ENABLE_READING_STATS_TOGGLE
  -DCROSSINK_SHOW_SLEEP_BUILD_INFO
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds
  -DOMIT_TEENSY_FONT
  -DOMIT_ITTY_BITTY_FONT
  -DOMIT_XLARGE_FONT
  -DOMIT_HUGE_FONT

; Omits two smallest and largest font sizes
[env:tiny]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSINK_VERSION=\"${crosspoint.crossink_version}-tiny\"
  -DCROSSPOINT_FIRMWARE_VARIANT=\"tiny\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DOMIT_TEENSY_FONT
  -DOMIT_ITTY_BITTY_FONT
  -DOMIT_XLARGE_FONT
  -DOMIT_HUGE_FONT

; Omits smaller font sizes and only includes the three largest font sizes
[env:xlarge]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSINK_VERSION=\"${crosspoint.crossink_version}-xlarge\"
  -DCROSSPOINT_FIRMWARE_VARIANT=\"xlarge\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DOMIT_TEENSY_FONT
  -DOMIT_ITTY_BITTY_FONT
  -DOMIT_TINY_FONT
  -DOMIT_SMALL_FONT
  -DOMIT_MEDIUM_FONT

[env:simulator]
platform = native
custom_run_simulator_target_owner = project
lib_compat_mode = off
build_src_filter =
  +<*>
  -<network/CrossPointWebServer.cpp>
  -<network/FirmwareFlasher.cpp>
  -<network/OtaBootSwitch.cpp>
  -<network/OtaUpdater.cpp>
  -<network/WebDAVHandler.cpp>
  -<platform/skip_efuse_blk_check.c>
build_flags =
  -std=gnu++2a
  !sdl2-config --cflags --libs
  -DSIMULATOR
  -Wno-c++11-narrowing
  -DCROSSINK_VERSION=\"${crosspoint.crossink_version}\"
  -DCROSSPOINT_FIRMWARE_VARIANT=\"simulator\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  ;-DSIMULATOR_DEVICE_X3 ; uncomment to simulate X3 screen size
  -Isrc
  ;-DOMIT_EMOJI_FONTS ; uncomment to omit emoji/symbols glyphs from reading fonts
  ;-DOMIT_TEENSY_FONT ; uncomment to omit teensy (8px) font size
  ;-DOMIT_ITTY_BITTY_FONT ; uncomment to omit itty bitty (9px) font size
  ;-DOMIT_TINY_FONT ; uncomment to omit tiny (10px) font size
  ;-DOMIT_SMALL_FONT ; uncomment to omit small (12px) font size
  ;-DOMIT_MEDIUM_FONT ; uncomment to omit medium (14px) font size
  ;-DOMIT_LARGE_FONT ; uncomment to omit large (16px) font size
  ;-DOMIT_XLARGE_FONT ; uncomment to omit extra large (18px) font size
  ;-DOMIT_HUGE_FONT ; uncomment to omit huge (20px) font size
  -DCROSSPOINT_SIM_USE_NATIVE_DECODERS
  -Dmemcpy_P=memcpy ; For native JPEGDEC
lib_ignore = hal, WebSockets
extra_scripts =
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/build_web.py
  post:.pio/libdeps/$PIOENV/simulator/run_simulator_project.py
lib_deps =
  simulator=https://github.com/uxjulia/crosspoint-simulator
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ ^0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
